name: Bug report
description: Report a reproducible problem in Lorestra
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including route or API response when relevant?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, locale, and commit if known.
