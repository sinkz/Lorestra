name: Feature request
description: Propose a small, reviewable improvement
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: Who needs this and what evidence supports it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become easier or clearer?
    validations:
      required: true
