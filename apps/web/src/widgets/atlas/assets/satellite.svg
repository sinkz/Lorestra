  />
  <path d="M104 70L128 85L156 71L133 55Z" fill="#D3DED2" />
  <path d="M128 85L156 71L153 120L124 138Z" fill="#344E61" />
  <path d="M107 76L122 86L119 126L106 116Z" fill="url(#gold)" />
  <path
    d="M107 76L119 94L106 116M122 86L108 104L119 126"
    stroke="#E2D3A3"
    stroke-opacity=".55"
    stroke-width=".8"
  />
  <path
    d="M128 86L155 72M128 86L125 135M105 70L127 84"
    stroke="#E8F0DE"
    stroke-opacity=".8"
  />
