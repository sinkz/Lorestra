<svg
  xmlns="http://www.w3.org/2000/svg"
  width="256"
  height="176"
  viewBox="0 0 256 176"
  fill="none"
>
  <title>Lorestra orbital knowledge relay</title>
  <defs>
    <linearGradient
      id="panel"
      x1="25"
      y1="56"
      x2="79"
      y2="119"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#559CC5" />
      <stop offset=".25" stop-color="#2D668D" />
      <stop offset="1" stop-color="#112E4E" />
    </linearGradient>
    <linearGradient
      id="metal"
      x1="108"
      y1="61"
      x2="147"
      y2="128"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#DCE8DF" />
      <stop offset=".42" stop-color="#98B4BC" />
      <stop offset="1" stop-color="#557380" />
    </linearGradient>
    <linearGradient
      id="gold"
      x1="105"
      y1="79"
      x2="124"
      y2="121"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#ECDAA7" />
      <stop offset=".5" stop-color="#BAA06D" />
      <stop offset="1" stop-color="#807152" />
    </linearGradient>
    <linearGradient
      id="dish"
      x1="115"
      y1="30"
      x2="139"
      y2="48"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#F1F7E9" />
      <stop offset="1" stop-color="#6F9AAE" />
    </linearGradient>
    <pattern
      id="cells"
      x="0"
      y="0"
      width="12"
      height="12"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M.6 0V12M0 .6H12"
        stroke="#8DCAE6"
        stroke-opacity=".55"
        stroke-width=".65"
      />
      <path d="M3 3H9V9H3z" stroke="#82B8D3" stroke-opacity=".22" stroke-width=".45" />
    </pattern>
  </defs>
  <!-- Mechanical truss and independent panel drives. -->
  <path d="M73 86H183" stroke="#45616F" stroke-width="9" />
  <path d="M73 83H183" stroke="#B8D3D8" stroke-width="2" />
  <path d="M87 79V93M169 79V93" stroke="#D2C89E" stroke-width="5" />
  <!-- Left solar wing, beveled frame, 4 × 5 cell grid. -->
  <path d="M13 55L78 59V116L13 122Z" fill="#0C2436" stroke="#7BABB9" stroke-width="2" />
  <path d="M17 59L74 62V113L17 118Z" fill="url(#panel)" />
  <path d="M17 59L74 62V113L17 118Z" fill="url(#cells)" />
  <path d="M16 58L75 61M16 119L75 114" stroke="#C0E2E9" stroke-opacity=".7" />
  <path d="M42 61V116" stroke="#071D31" stroke-width="3" />
  <path d="M42 61V116" stroke="#8CB7C9" stroke-width=".7" />
  <!-- Right wing is perspective-matched, not a mirrored flat rectangle. -->
  <path
    d="M179 60L243 51V114L179 117Z"
    fill="#0C2436"
    stroke="#7BABB9"
    stroke-width="2"
  />
  <path d="M183 63L239 55V110L183 113Z" fill="url(#panel)" />
  <path d="M183 63L239 55V110L183 113Z" fill="url(#cells)" />
  <path d="M182 62L240 54M182 114L240 111" stroke="#C0E2E9" stroke-opacity=".65" />
  <path d="M210 59V112" stroke="#071D31" stroke-width="3" />
  <path d="M210 59V112" stroke="#8CB7C9" stroke-width=".7" />
