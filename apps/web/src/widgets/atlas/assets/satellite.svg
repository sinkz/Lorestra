  <path d="M129 61L126 43" stroke="#BECFCB" stroke-width="4" />
  <path d="M118 39L132 49L144 34" stroke="#597C8B" stroke-width="2" />
  <path
    d="M109 32Q126 53 146 30Q129 39 109 32Z"
    fill="url(#dish)"
    stroke="#D7ECE8"
    stroke-width="1.2"
  />
  <path
    d="M110 32Q129 20 146 30Q132 38 110 32Z"
    fill="#9ABAC2"
    stroke="#E8F1E5"
    stroke-width="1.2"
  />
  <path d="M115 31Q129 25 140 30" stroke="#F4FAEA" stroke-opacity=".65" />
  <path
    d="M129 32L133 16M128 31L119 27M130 31L140 26"
    stroke="#CDDCD3"
    stroke-width="1.2"
    stroke-linecap="round"
  />
  <circle cx="133" cy="15" r="2" fill="#D3F56A" />
