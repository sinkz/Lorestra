  <path d="M151 78L165 58L169 42" stroke="#ADCAD0" stroke-width="1.5" />
  <path d="M161 61L169 62M165 49L172 51" stroke="#789AAE" />
  <circle cx="169" cy="41" r="2.3" fill="#83C8EC" />
  <circle cx="112" cy="86" r="2.2" fill="#D3F56A" />
  <circle cx="112" cy="94" r="1.6" fill="#E9B977" />
  <path d="M122 136L121 146L129 145L132 133" fill="#233E4F" stroke="#96B3BC" />
  <path d="M123 146L127 146" stroke="#C9E5E6" stroke-width="2" />
  <circle cx="105" cy="73" r="1" fill="#F0F6E9" />
  <circle cx="151" cy="74" r="1" fill="#F0F6E9" />
  <circle cx="150" cy="117" r="1" fill="#A8C9D2" />
